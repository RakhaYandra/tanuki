version: "1"

project:
  name: pulse

runtime:
  go: "1.27"

services:
  postgres:
    type: postgres
    version: "16"
    port: 5432
    healthcheck:
      type: tcp
      timeout: 30s

  redis:
    type: redis
    version: "7"
    port: 6379
    healthcheck:
      type: tcp
      timeout: 30s

application:
  name: api
  command:
    - go
    - run
    - ./cmd/api
  port: 8080
  depends_on:
    - postgres
    - redis
  healthcheck:
    type: http
    path: /health
    timeout: 60s
